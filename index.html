<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Yared Gebretsadkan | Filmmaker &amp; Cinematographer</title>
<meta name="description" content="Yared Gebretsadkan — Addis Ababa-based filmmaker and cinematographer. Selected work in short film, commercial and documentary cinematography.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script>
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", user => {
      if (!user) {
        window.netlifyIdentity.on("login", () => {
          document.location.href = "/admin/";
        });
      }
    });
  }
</script>
<style>
  :root{
    --black:#000000; --white:#ffffff; --gray:#a0a0a0; --dark-gray:#222222; --accent:#ff6b35;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ background:#000; color:var(--white); font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-weight:300; -webkit-font-smoothing:antialiased; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; background:none; border:none; color:inherit; cursor:pointer; padding:0; }
  img,video{ display:block; }
  ::selection{ background:var(--accent); color:#000; }
  :focus-visible{ outline:1px solid var(--accent); outline-offset:3px; }

  #app{ position:relative; width:100%; min-height:100vh; }
  .view{ display:none; }
  .view.is-active{ display:block; }

  /* ---- Nav ---- */
  .nav{ position:fixed; top:0; left:0; right:0; z-index:200; display:flex; align-items:center; justify-content:space-between; padding:26px 32px; pointer-events:none; background:linear-gradient(to bottom, rgba(0,0,0,.5), transparent); transition:background .35s ease, padding .35s ease, backdrop-filter .35s ease; }
  .nav.is-scrolled{ background:rgba(0,0,0,.86); backdrop-filter:blur(6px); padding:16px 32px; box-shadow:0 1px 0 rgba(255,255,255,.06); }
  .nav > *{ pointer-events:auto; }
  .nav__brand{ font-size:13px; letter-spacing:.14em; font-weight:500; }
  .nav__links{ display:flex; gap:28px; list-style:none; }
  .nav__item{ position:relative; }
  .nav__links a{ font-size:12px; letter-spacing:.14em; font-weight:400; color:var(--gray); position:relative; transition:color .3s ease; }
  .nav__links a::after{ content:''; position:absolute; left:0; right:0; bottom:-6px; height:1px; background:var(--accent); transform:scaleX(0); transform-origin:left; transition:transform .35s ease; }
  .nav__links a:hover, .nav__links a.is-current{ color:var(--white); }
  .nav__links a.is-current::after{ transform:scaleX(1); }

  .nav__dropdown{
    position:absolute; top:100%; left:50%; margin-top:16px; min-width:160px;
    background:rgba(8,8,8,.94); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.08);
    padding:10px 0; text-align:center; opacity:0; visibility:hidden; pointer-events:none;
    transform:translateX(-50%) translateY(-6px);
    transition:opacity .28s ease, transform .28s ease, visibility 0s linear .28s;
  }
  .nav__item:hover .nav__dropdown, .nav__item.is-open .nav__dropdown{
    opacity:1; visibility:visible; pointer-events:auto; transform:translateX(-50%) translateY(0);
    transition:opacity .28s ease, transform .28s ease, visibility 0s;
  }
  .nav__dropdown a{ display:block; padding:9px 20px; font-size:10.5px; letter-spacing:.12em; color:var(--gray); white-space:nowrap; }
  .nav__dropdown a::after{ display:none; }
  .nav__dropdown a:hover{ color:var(--white); }
  .nav__dropdown a.is-active{ color:var(--accent); }

  /* ---- Work list ---- */
  .work-list{ padding:150px 32px 80px; max-width:1400px; margin:0 auto; min-height:100vh; }
  .work-row{ display:block; margin-bottom:64px; }
  .work-row__grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; }
  .work-row__img{ position:relative; aspect-ratio:4/3; overflow:hidden; background:var(--dark-gray); display:block; }
  .work-row__img img{ width:100%; height:100%; object-fit:cover; display:block; transition:transform .5s ease; }
  .work-row__img video{ width:100%; height:100%; object-fit:cover; display:block; }
  .work-row__img--main:hover video{ transform:scale(1.03); }
  .work-row__video-badge{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:44px; height:44px; border-radius:50%; border:1px solid rgba(255,255,255,.6);
    display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,.25); backdrop-filter:blur(3px);
    transition:opacity .3s ease, transform .3s ease;
  }
  .work-row__video-badge svg{ width:14px; height:14px; margin-left:2px; color:var(--white); }
  .work-row__img--main:hover .work-row__video-badge{ opacity:0; transform:translate(-50%,-50%) scale(.8); }
  .work-row__img--main{ cursor:pointer; }
  .work-row__img--main:hover img{ transform:scale(1.03); }
  .work-row__img--side img{ transition:transform .5s cubic-bezier(.2,.7,.3,1); }
  .work-row__img--side:hover img{ transform:scale(1.18); }
  .work-row__caption{ text-align:center; margin-top:18px; display:block; cursor:pointer; }
  .work-row__title{ font-size:12.5px; letter-spacing:.08em; font-weight:500; color:var(--white); }
  .work-row__dir{ font-size:11px; letter-spacing:.08em; color:var(--gray); margin-top:4px; }
  .work-list__empty{ text-align:center; color:var(--gray); font-size:13px; padding:80px 0; }

  /* ---- Project detail ---- */
  .pp__hero{ position:relative; width:100%; height:100dvh; overflow:hidden; display:flex; flex-direction:column; justify-content:flex-end; }
  .pp__hero-media{ position:absolute; inset:0; }
  .pp__hero-media img{ width:100%; height:100%; object-fit:cover; }
  .pp__hero-media::after{ content:''; position:absolute; inset:0; background:linear-gradient(to top, rgba(0,0,0,.75) 0%, rgba(0,0,0,.15) 45%, rgba(0,0,0,.35) 100%); }
  .pp__hero-content{ position:relative; z-index:2; padding:0 32px 56px; max-width:900px; }
  .pp__eyebrow{ font-size:11px; letter-spacing:.1em; color:var(--gray); margin-bottom:14px; }
  .pp__title{ font-size:clamp(32px, 6vw, 64px); font-weight:500; letter-spacing:-.02em; line-height:1.02; margin-bottom:22px; }
  .pp__meta-row{ display:flex; gap:28px; flex-wrap:wrap; font-size:12px; color:var(--gray); }
  .pp__meta-row .label{ display:block; text-transform:uppercase; letter-spacing:.1em; font-size:10px; color:var(--gray); margin-bottom:4px; }
  .pp__meta-row .val{ font-size:13px; color:var(--white); font-weight:400; }
  .pp__body{ max-width:640px; padding:96px 32px; margin:0 auto; }
  .pp__desc{ font-size:16px; line-height:1.75; color:#d8d8d8; font-weight:300; }
  .pp__main-video{ width:100%; padding:0 32px; margin:0 auto; max-width:1400px; }
  .pp__main-video .video-frame{ position:relative; width:100%; aspect-ratio:16/9; background:var(--dark-gray); overflow:hidden; }
  .video-frame video, .video-frame img{ width:100%; height:100%; object-fit:cover; }
  .video-frame__play{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:56px; height:56px; border-radius:50%; border:1px solid rgba(255,255,255,.5); display:flex; align-items:center; justify-content:center; backdrop-filter:blur(4px); background:rgba(0,0,0,.2); transition:transform .3s ease, border-color .3s ease; }
  .video-frame__play:hover{ transform:translate(-50%,-50%) scale(1.06); border-color:var(--accent); }
  .video-frame__play svg{ width:14px; height:14px; margin-left:2px; }
  .watch-external{
    display:inline-block; margin-top:16px; font-size:11px; letter-spacing:.12em;
    color:var(--gray); border-bottom:1px solid rgba(255,255,255,.2); padding-bottom:3px;
    transition:color .25s ease, border-color .25s ease;
  }
  .watch-external:hover{ color:var(--accent); border-color:var(--accent); }
  .pp__gallery{ padding:120px 32px; max-width:1400px; margin:0 auto; }
  .pp__gallery-grid{ display:grid; grid-template-columns:repeat(12,1fr); gap:16px; }
  .pp__gallery-grid .g{ position:relative; overflow:hidden; }
  .pp__gallery-grid .g img{ width:100%; height:100%; object-fit:cover; display:block; }
  .pp__gallery-grid .g:nth-child(6n+1){ grid-column:1 / 8; aspect-ratio:16/10; }
  .pp__gallery-grid .g:nth-child(6n+2){ grid-column:8 / 13; aspect-ratio:3/4; }
  .pp__gallery-grid .g:nth-child(6n+3){ grid-column:1 / 5; aspect-ratio:3/4; margin-top:40px; }
  .pp__gallery-grid .g:nth-child(6n+4){ grid-column:5 / 13; aspect-ratio:16/9; margin-top:40px; }
  .pp__gallery-grid .g:nth-child(6n+5){ grid-column:1 / 13; aspect-ratio:21/9; margin-top:40px; }
  .pp__gallery-grid .g:nth-child(6n){ grid-column:1 / 13; aspect-ratio:21/9; margin-top:40px; }
  .pp__credits{ padding:0 32px 140px; max-width:640px; margin:0 auto; }
  .pp__credits h3{ font-size:11px; letter-spacing:.14em; color:var(--gray); font-weight:500; margin-bottom:28px; }
  .pp__credits-list{ display:flex; flex-direction:column; gap:16px; }
  .pp__credits-row{ display:flex; justify-content:space-between; padding-bottom:16px; border-bottom:1px solid rgba(255,255,255,.08); font-size:14px; }
  .pp__credits-row .role{ color:var(--gray); }
  .pp__credits-row .name{ font-weight:400; }
  .pp__footer-nav{ display:flex; justify-content:space-between; align-items:center; padding:36px 32px; border-top:1px solid rgba(255,255,255,.08); font-size:12px; letter-spacing:.06em; }
  .pp__footer-nav a{ color:var(--gray); transition:color .25s ease; }
  .pp__footer-nav a:hover{ color:var(--white); }
  .pp__footer-nav .next{ text-align:right; }

  /* ---- About ---- */
  .about{ min-height:100vh; display:flex; align-items:center; padding:150px 32px 100px; }
  .about__inner{ max-width:820px; margin:0 auto; display:grid; grid-template-columns:220px 1fr; gap:56px; align-items:start; }
  .about__portrait{ width:100%; aspect-ratio:3/4; object-fit:cover; filter:grayscale(1); }
  .about__name{ font-size:clamp(28px, 4vw, 44px); font-weight:500; letter-spacing:-.02em; margin-bottom:10px; }
  .about__role{ font-size:12px; letter-spacing:.14em; color:var(--gray); margin-bottom:40px; }
  .about__bio{ font-size:16px; line-height:1.8; color:#d8d8d8; font-weight:300; margin-bottom:24px; }
  .about__facts{ display:grid; grid-template-columns:1fr 1fr; gap:24px 32px; padding-top:32px; border-top:1px solid rgba(255,255,255,.08); margin-top:24px; }
  .about__fact .label{ font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--gray); margin-bottom:6px; }
  .about__fact .val{ font-size:14px; font-weight:400; }

  /* ---- Contact ---- */
  .contact{ min-height:100vh; display:flex; align-items:center; padding:150px 32px 100px; }
  .contact__inner{ max-width:560px; margin:0 auto; }
  .contact__title{ font-size:clamp(28px, 5vw, 46px); font-weight:500; letter-spacing:-.02em; margin-bottom:20px; }
  .contact__lede{ font-size:15px; line-height:1.7; color:#d8d8d8; font-weight:300; margin-bottom:56px; max-width:420px; }
  .contact__list{ display:flex; flex-direction:column; }
  .contact__item{ display:flex; justify-content:space-between; align-items:center; padding:22px 0; border-bottom:1px solid rgba(255,255,255,.08); transition:padding-left .3s ease; }
  .contact__item:hover{ padding-left:8px; }
  .contact__item .label{ font-size:11px; letter-spacing:.1em; color:var(--gray); text-transform:uppercase; }
  .contact__item .value{ font-size:16px; font-weight:400; }
  .contact__item:hover .value{ color:var(--accent); }

  .site-footer{ padding:40px 32px; display:flex; justify-content:space-between; font-size:10px; letter-spacing:.08em; color:#555; border-top:1px solid rgba(255,255,255,.06); }

  .loading-note{ padding:150px 32px; text-align:center; color:var(--gray); font-size:12px; letter-spacing:.08em; }

  @media (prefers-reduced-motion: reduce){
    *{ transition-duration:.001ms !important; }
  }

  @media (max-width: 860px){
    .nav{ padding:18px 20px; }
    .nav__links{ gap:18px; }
    .work-list{ padding:110px 16px 60px; }
    .work-row{ margin-bottom:44px; }
    .work-row__grid{ gap:4px; }
    .work-row__title{ font-size:11px; }
    .pp__hero{ height:80vh; }
    .pp__body{ padding:56px 20px; }
    .pp__main-video{ padding:0 20px; }
    .pp__gallery{ padding:64px 20px; }
    .pp__gallery-grid{ grid-template-columns:1fr; gap:14px; }
    .pp__gallery-grid .g{ grid-column:1/-1 !important; margin-top:0 !important; aspect-ratio:4/3 !important; }
    .pp__credits{ padding:0 20px 80px; }
    .pp__footer-nav{ padding:28px 20px; flex-direction:column; gap:10px; align-items:flex-start; }
    .about, .contact{ padding:120px 20px 70px; }
    .about__inner{ grid-template-columns:1fr; gap:28px; }
    .about__portrait{ max-width:200px; }
    .about__facts{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<nav class="nav">
  <a href="#/" class="nav__brand" id="navBrand">YARED GEBRETSADKAN</a>
  <ul class="nav__links" id="navLinks">
    <li class="nav__item" id="workNavItem">
      <a href="#/" data-route="/" id="workNavLink">WORK</a>
      <div class="nav__dropdown" id="workDropdown">
        <a href="#" data-cat="all">SELECTED WORK</a>
        <a href="#" data-cat="commercial">COMMERCIAL</a>
        <a href="#" data-cat="narrative">NARRATIVE</a>
      </div>
    </li>
    <li><a href="#/about" data-route="/about">ABOUT</a></li>
    <li><a href="#/contact" data-route="/contact">CONTACT</a></li>
  </ul>
</nav>

<div id="app">
  <section class="view" id="view-home">
    <div class="work-list" id="workList"><div class="loading-note">Loading work…</div></div>
  </section>

  <section class="view" id="view-project">
    <article class="pp" id="projectPage"></article>
  </section>

  <section class="view" id="view-about">
    <div class="about"><div class="about__inner" id="aboutInner"></div></div>
  </section>

  <section class="view" id="view-contact">
    <div class="contact"><div class="contact__inner" id="contactInner"></div></div>
  </section>
</div>

<footer class="site-footer">
  <span id="footerName">© 2026 YARED GEBRETSADKAN</span>
  <span>FILMMAKER / CINEMATOGRAPHER</span>
</footer>

<script>
(function(){
  let PROFILE = null;
  let PROJECTS = [];
  let currentFilter = 'all';

  const views = {
    home: document.getElementById('view-home'),
    project: document.getElementById('view-project'),
    about: document.getElementById('view-about'),
    contact: document.getElementById('view-contact'),
  };
  const navLinks = document.querySelectorAll('#navLinks a[data-route]');

  function setActiveNav(route){
    navLinks.forEach(a => a.classList.toggle('is-current', a.dataset.route === route));
  }
  function showView(name){
    Object.values(views).forEach(v => v.classList.remove('is-active'));
    views[name].classList.add('is-active');
    window.scrollTo(0,0);
  }

  function filterProjects(){
    if(currentFilter === 'commercial') return PROJECTS.filter(p => (p.category||'').toLowerCase() === 'commercial');
    if(currentFilter === 'narrative') return PROJECTS.filter(p => (p.category||'').toLowerCase() !== 'commercial');
    return PROJECTS;
  }

  function buildWorkList(){
    const listEl = document.getElementById('workList');
    const list = filterProjects();
    if(!list.length){
      listEl.innerHTML = '<div class="work-list__empty">No projects in this category yet.</div>';
    } else {
      listEl.innerHTML = list.map(p => {
        const mainMedia = p.video
          ? `<video class="work-row__video" muted loop playsinline poster="${p.mid}" preload="none"><source src="${p.video}"></video>
             <div class="work-row__video-badge" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div>`
          : `<img src="${p.mid}" alt="" loading="lazy">`;
        return `
        <div class="work-row">
          <div class="work-row__grid">
            <div class="work-row__img work-row__img--side"><img src="${p.left}" alt="" loading="lazy"></div>
            <a class="work-row__img work-row__img--main" href="#/work/${p.slug}" aria-label="Open ${p.title}">${mainMedia}</a>
            <div class="work-row__img work-row__img--side"><img src="${p.right}" alt="" loading="lazy"></div>
          </div>
          <a class="work-row__caption" href="#/work/${p.slug}" aria-label="Open ${p.title}">
            <div class="work-row__title">${(p.title||'').toUpperCase()} (${(p.category||'').toUpperCase()})</div>
            <div class="work-row__dir">DIR. ${(p.director||'').toUpperCase()}</div>
          </a>
        </div>`;
      }).join('');

      // Hover-to-play for any row whose middle slot has a real video.
      listEl.querySelectorAll('.work-row__video').forEach(videoEl => {
        const link = videoEl.closest('.work-row__img--main');
        link.addEventListener('mouseenter', ()=> videoEl.play().catch(()=>{}));
        link.addEventListener('mouseleave', ()=>{ videoEl.pause(); videoEl.currentTime = 0; });
        link.addEventListener('touchstart', ()=> videoEl.play().catch(()=>{}), { passive:true });
      });
    }
    document.querySelectorAll('.nav__dropdown a').forEach(a => a.classList.toggle('is-active', a.dataset.cat === currentFilter));
  }

  function getEmbedUrl(url){
    if(!url) return null;
    let m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([\w-]{6,})/);
    if(m) return `https://www.youtube.com/embed/${m[1]}`;
    m = url.match(/vimeo\.com\/(\d+)/);
    if(m) return `https://player.vimeo.com/video/${m[1]}`;
    return null;
  }

  function renderProject(slug){
    const idx = PROJECTS.findIndex(p => p.slug === slug);
    const p = PROJECTS[idx] || PROJECTS[0];
    if(!p) return;
    const nextP = PROJECTS[(idx+1) % PROJECTS.length];
    document.title = p.title + ' — ' + (PROFILE ? PROFILE.name : '');

    const gallery = (p.gallery && p.gallery.length) ? p.gallery : [p.left, p.mid, p.right];
    const galleryHtml = gallery.map(g => `<div class="g"><img src="${g}" alt="" loading="lazy"></div>`).join('');
    const creditsHtml = (p.credits||[]).map(c => `
      <div class="pp__credits-row"><span class="role">${c.role}</span><span class="name">${c.name}</span></div>
    `).join('');

    const embedUrl = getEmbedUrl(p.external_video_url);
    let videoHtml, watchLinkHtml = '';
    let frameKind = 'none';

    if(p.video){
      // A file was uploaded directly through the admin — takes priority.
      // Starts paused on the poster; hover gives a quiet preview, and an
      // actual click (native play button) plays it with sound.
      videoHtml = `<video loop playsinline controls preload="metadata" poster="${p.mid}" aria-label="${p.title} — main film">
           <source src="${p.video}">
         </video>`;
      frameKind = 'video';
    } else if(embedUrl){
      // A YouTube/Vimeo link — starts on its poster, plays inline on hover.
      videoHtml = `<img src="${p.mid}" alt="${p.title} — still">
        <div class="video-frame__play" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </div>`;
      frameKind = 'embed';
    } else if(p.external_video_url){
      // A link to a platform that can't be embedded directly (e.g. Facebook) — link out instead.
      videoHtml = `<img src="${p.mid}" alt="${p.title} — still">`;
      watchLinkHtml = `<a class="watch-external" href="${p.external_video_url}" target="_blank" rel="noopener">WATCH FULL FILM ↗</a>`;
    } else {
      // No video yet — just the still, no fake play button implying a video exists.
      videoHtml = `<img src="${p.mid}" alt="${p.title} — still">`;
    }

    document.getElementById('projectPage').innerHTML = `
      <div class="pp__hero">
        <div class="pp__hero-media"><img src="${p.left}" alt=""></div>
        <div class="pp__hero-content">
          <div class="pp__eyebrow">${p.category} — ${p.year}</div>
          <h1 class="pp__title">${p.title}</h1>
          <div class="pp__meta-row">
            <span><span class="label">Directed by</span><span class="val">${p.director}</span></span>
            <span><span class="label">Year</span><span class="val">${p.year}</span></span>
            <span><span class="label">Category</span><span class="val">${p.category}</span></span>
          </div>
        </div>
      </div>
      <div class="pp__main-video">
        <div class="video-frame" id="ppVideoFrame" data-kind="${frameKind}" data-embed-url="${embedUrl || ''}">${videoHtml}</div>
        ${watchLinkHtml}
      </div>
      <div class="pp__body"><p class="pp__desc">${p.description}</p></div>
      <div class="pp__gallery"><div class="pp__gallery-grid">${galleryHtml}</div></div>
      <div class="pp__credits"><h3>CREDITS</h3><div class="pp__credits-list">${creditsHtml}</div></div>
      <div class="pp__footer-nav">
        <a href="#/">← BACK TO WORK</a>
        <a class="next" href="#/work/${nextP.slug}">NEXT PROJECT: ${(nextP.title||'').toUpperCase()} →</a>
      </div>
    `;

    // Hover-to-play: an uploaded video plays/pauses on hover; a YouTube/Vimeo
    // link only loads its iframe (and starts playing) once hovered, so the
    // page doesn't load/play video nobody asked to see.
    const frame = document.getElementById('ppVideoFrame');
    if(frame){
      const kind = frame.dataset.kind;
      if(kind === 'video'){
        const videoEl = frame.querySelector('video');
        videoEl.muted = false; // real sound is the default; hover only mutes briefly for a quiet preview
        frame.addEventListener('mouseenter', ()=>{
          videoEl.muted = true;
          videoEl.play().catch(()=>{});
        });
        frame.addEventListener('mouseleave', ()=>{
          videoEl.pause();
          videoEl.currentTime = 0;
          videoEl.muted = false;
        });
        // On an actual click (a real play, not just a hover preview), keep it unmuted.
        videoEl.addEventListener('play', ()=>{
          if(!frame.matches(':hover')) videoEl.muted = false;
        });
      } else if(kind === 'embed'){
        let loaded = false;
        frame.addEventListener('mouseenter', ()=>{
          if(loaded) return;
          loaded = true;
          const src = frame.dataset.embedUrl + (frame.dataset.embedUrl.includes('?') ? '&' : '?') + 'autoplay=1&mute=1';
          frame.innerHTML = `<iframe src="${src}" title="video" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy" style="width:100%;height:100%;border:0;"></iframe>`;
        });
      }
    }
  }

  function renderAbout(){
    const p = PROFILE;
    if(!p) return;
    document.getElementById('aboutInner').innerHTML = `
      <img class="about__portrait" src="${p.portrait}" alt="Portrait of ${p.name}">
      <div>
        <h1 class="about__name">${p.name}</h1>
        <p class="about__role">${(p.role||'').toUpperCase()}</p>
        <p class="about__bio">${p.bio_paragraph_1||''}</p>
        <p class="about__bio">${p.bio_paragraph_2||''}</p>
        <div class="about__facts">
          <div class="about__fact"><div class="label">Based in</div><div class="val">${p.based_in||''}</div></div>
          <div class="about__fact"><div class="label">Education</div><div class="val">${p.education||''}</div></div>
          <div class="about__fact"><div class="label">Focus</div><div class="val">${p.focus||''}</div></div>
          <div class="about__fact"><div class="label">Available for</div><div class="val">${p.available_for||''}</div></div>
          ${p.additional_credit ? `<div class="about__fact"><div class="label">Additional credit</div><div class="val">${p.additional_credit}</div></div>` : ''}
        </div>
      </div>
    `;
  }

  function renderContact(){
    const p = PROFILE;
    if(!p) return;
    document.getElementById('contactInner').innerHTML = `
      <h1 class="contact__title">Contact</h1>
      <p class="contact__lede">For film, cinematography, production and creative collaborations, reach out directly.</p>
      <div class="contact__list">
        <a class="contact__item" href="mailto:${p.contact_email}">
          <span class="label">Email</span><span class="value">${p.contact_email}</span>
        </a>
        <a class="contact__item" href="${p.instagram_url || '#'}" target="${p.instagram_url ? '_blank' : ''}" rel="noopener">
          <span class="label">Instagram</span><span class="value">${p.instagram_handle||''}</span>
        </a>
        <a class="contact__item" href="${p.linkedin_url || '#'}" target="${p.linkedin_url ? '_blank' : ''}" rel="noopener">
          <span class="label">LinkedIn</span><span class="value">${p.linkedin_label||''}</span>
        </a>
      </div>
    `;
  }

  function router(){
    const hash = location.hash.replace(/^#/,'') || '/';
    if(hash === '/'){
      showView('home'); setActiveNav('/'); buildWorkList();
    } else if(hash === '/about'){
      showView('about'); setActiveNav('/about'); renderAbout();
    } else if(hash === '/contact'){
      showView('contact'); setActiveNav('/contact'); renderContact();
    } else if(hash.indexOf('/work/') === 0){
      renderProject(hash.replace('/work/',''));
      showView('project'); setActiveNav('');
    } else {
      showView('home'); setActiveNav('/'); buildWorkList();
    }
    closeWorkDropdown();
  }
  window.addEventListener('hashchange', router);

  const navEl = document.querySelector('.nav');
  function updateNavScrollState(){
    if(window.scrollY > 40){ navEl.classList.add('is-scrolled'); }
    else{ navEl.classList.remove('is-scrolled'); }
  }
  window.addEventListener('scroll', updateNavScrollState, { passive:true });
  updateNavScrollState();

  const workNavItem = document.getElementById('workNavItem');
  const workDropdown = document.getElementById('workDropdown');
  function closeWorkDropdown(){ workNavItem.classList.remove('is-open'); }
  document.getElementById('workNavLink').addEventListener('click', (e)=>{
    e.preventDefault();
    workNavItem.classList.toggle('is-open');
    if(location.hash.replace(/^#/,'') !== '/') location.hash = '#/';
  });
  workDropdown.querySelectorAll('a').forEach(a=>{
    a.addEventListener('click', (e)=>{
      e.preventDefault();
      currentFilter = a.dataset.cat;
      if(location.hash.replace(/^#/,'') !== '/') location.hash = '#/';
      buildWorkList();
      closeWorkDropdown();
    });
  });
  document.addEventListener('click', (e)=>{ if(!workNavItem.contains(e.target)) closeWorkDropdown(); });
  document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeWorkDropdown(); });

  Promise.all([
    fetch('content/profile.json').then(r => r.json()),
    fetch('content/projects.json').then(r => r.json())
  ]).then(([profile, projectsData])=>{
    PROFILE = profile;
    PROJECTS = projectsData.items || [];
    document.getElementById('navBrand').textContent = (profile.name || '').toUpperCase();
    document.getElementById('footerName').textContent = '© 2026 ' + (profile.name || '').toUpperCase();
    document.title = profile.name + ' | ' + profile.role;
    router();
  }).catch(err=>{
    document.getElementById('workList').innerHTML =
      '<div class="loading-note">Could not load site content (content/profile.json or content/projects.json). If you just deployed, make sure both files are present at the site root under /content/.</div>';
    console.error(err);
  });
})();
</script>
</body>
</html>
